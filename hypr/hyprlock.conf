# Theosis hyprlock, version 0.9.7 from ppa:cppiber/hyprland
# hyprlock still uses the hyprlang .conf format.
# Install path: ~/.config/hypr/hyprlock.conf
# Palette from dionysus: glow 1fbeff, cyan 56b6c2, ice 9cdef2, red e06c75, base 1e1e2e

# Font. Install fonts-jetbrains-mono or change this, pango falls back to the default if missing.
$font = JetBrains Mono

general {
    hide_cursor = true
}

# Short fades on his easeOutQuint curve
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 2, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

# Blurred, darkened screenshot of the desktop, dark base colour behind it
background {
    monitor =
    path = screenshot
    color = rgba(1e1e2eff)
    blur_passes = 2
    blur_size = 4
    brightness = 0.4
}

# Password box with the cyan gradient outline
input-field {
    monitor =
    size = 18%, 5%
    outline_thickness = 2
    rounding = 2
    inner_color = rgba(1e1e2ecc)
    outer_color = rgba(1fbeffee) rgba(56b6c2ee) 45deg
    check_color = rgba(9cdef2ee)
    fail_color = rgba(e06c75ee)
    font_color = rgb(156, 222, 242)
    font_family = $font
    fade_on_empty = false
    placeholder_text = password
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}

# Clock in cyan
label {
    monitor =
    text = $TIME
    color = rgba(56b6c2ff)
    font_size = 96
    font_family = $font

    position = 0, 160
    halign = center
    valign = center
}

# Date in ice blue, refreshed every minute
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgba(9cdef2ff)
    font_size = 22
    font_family = $font

    position = 0, 60
    halign = center
    valign = center
}

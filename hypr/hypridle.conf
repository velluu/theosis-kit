# Theosis hypridle, version 0.1.8 from ppa:cppiber/hyprland
# hypridle still uses the hyprlang .conf format, only Hyprland itself moved to Lua.
# Install path: ~/.config/hypr/hypridle.conf
# Screen off and lock only. There is deliberately no suspend listener.

# Lock command for "loginctl lock-session" and the lid path, one hyprlock at a time
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Lock after 5 minutes idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Panel off 30 seconds later, back on with any input (0.57 Lua dispatch syntax)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
